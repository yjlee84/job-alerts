name: Daily Job Applications

on:
  schedule:
    - cron: '0 9 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      mode:
        description: Run applications or inspect cloud browser access without applying
        type: choice
        options: [apply, probe]
        default: apply

permissions:
  contents: write

concurrency:
  group: job-applications-production
  cancel-in-progress: false

env:
  OPENAI_MODEL: gpt-5.4-mini
  PYTHONUNBUFFERED: '1'

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JOB_ALERTS_CLOUD: '1'
      BROWSER_HEADLESS: '0'
      GITHUB_TOKEN: ${{ github.token }}
      JOB_ALERTS_STATE_KEY: ${{ secrets.JOB_ALERTS_STATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      JOB_ALERTS_EMAIL_TO: ${{ secrets.JOB_ALERTS_EMAIL_TO }}
      JOB_ALERTS_EMAIL_FROM: ${{ secrets.JOB_ALERTS_EMAIL_FROM }}
      JOB_ALERTS_SMTP_HOST: ${{ secrets.JOB_ALERTS_SMTP_HOST }}
      JOB_ALERTS_SMTP_PORT: ${{ secrets.JOB_ALERTS_SMTP_PORT }}
      JOB_ALERTS_SMTP_USERNAME: ${{ secrets.JOB_ALERTS_SMTP_USERNAME }}
      JOB_ALERTS_SMTP_PASSWORD: ${{ secrets.JOB_ALERTS_SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and encryption dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run safety tests
        env:
          JOB_ALERTS_CLOUD: '0'
        run: python -m unittest discover -s tests -v
      - name: Install document tools
        if: inputs.mode != 'probe'
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk biber texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-extra texlive-bibtex-extra poppler-utils
      - name: Check cloud browser access without applying
        if: inputs.mode == 'probe'
        run: xvfb-run -a python scripts/cloud_runner.py --probe
      - name: Discover, tailor, apply, save receipts and email confirmations
        if: inputs.mode != 'probe'
        run: xvfb-run -a python scripts/cloud_runner.py
      - name: Sync tracker, descriptions and tailored documents to the project
        if: always() && inputs.mode != 'probe'
        run: python scripts/publish_cloud_outputs.py
