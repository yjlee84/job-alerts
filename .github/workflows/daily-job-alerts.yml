name: Job Alerts

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENAI_MODEL: gpt-5.4-mini

permissions:
  contents: write

jobs:
  run-pipeline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      JOB_ALERTS_EMAIL_TO: iyongjae6@gmail.com
      JOB_ALERTS_EMAIL_FROM: ${{ secrets.JOB_ALERTS_EMAIL_FROM }}
      JOB_ALERTS_SMTP_HOST: ${{ secrets.JOB_ALERTS_SMTP_HOST }}
      JOB_ALERTS_SMTP_PORT: ${{ secrets.JOB_ALERTS_SMTP_PORT }}
      JOB_ALERTS_SMTP_USERNAME: ${{ secrets.JOB_ALERTS_SMTP_USERNAME }}
      JOB_ALERTS_SMTP_PASSWORD: ${{ secrets.JOB_ALERTS_SMTP_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            biber \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-bibtex-extra \
            poppler-utils

      - name: Run job alerts pipeline
        run: |
          python3 scripts/fetch_jobs.py
          python3 scripts/filter_jobs.py
          python3 scripts/sync_job_tracker.py
          python3 scripts/prepare_application.py --all-review
          python3 scripts/build_alert_report.py

      - name: Commit updated pipeline outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fetch_runs.csv data/job_listings.csv
          git add -A reports
          if [ -d outputs ]; then
            git add outputs
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update job alerts outputs"
          git push
